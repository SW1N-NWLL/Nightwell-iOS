name: Build Nightwell iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Build Nightwell
        run: |
          xcodebuild \
            -project Nightwell.xcodeproj \
            -target Nightwell \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check build
        run: |
          echo "Build contents:"
          ls -la build/

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Nightwell.app Payload/Nightwell.app
          zip -r Nightwell-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nightwell-IPA
          path: Nightwell-unsigned.ipa
