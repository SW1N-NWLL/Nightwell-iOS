name: Build Nightwell iOS

on:

  workflow_dispatch:

  push:

    branches:

      - main

jobs:

  build:

    runs-on: macos-15

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Select Xcode

        run: |

          sudo xcode-select -s /Applications/Xcode_16.4.app

          xcodebuild -version

      - name: Build Nightwell

        shell: bash

        run: |

          set -euo pipefail

          xcodebuild -project "$GITHUB_WORKSPACE/Nightwell.xcodeproj" -target Nightwell -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" TARGETED_DEVICE_FAMILY=1 INFOPLIST_KEY_UILaunchScreen_Generation=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Check build

        shell: bash

        run: |

          set -euo pipefail

          test -d "$GITHUB_WORKSPACE/build/Nightwell.app"

          ls -la "$GITHUB_WORKSPACE/build/Nightwell.app"

      - name: Create IPA

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R "$GITHUB_WORKSPACE/build/Nightwell.app" "$GITHUB_WORKSPACE/Payload/Nightwell.app"

          cd "$GITHUB_WORKSPACE"

          /usr/bin/zip -qr Nightwell-unsigned.ipa Payload

          test -f Nightwell-unsigned.ipa

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: Nightwell-IPA

          path: Nightwell-unsigned.ipa

          if-no-files-found: error
